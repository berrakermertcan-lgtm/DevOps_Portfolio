
services:
  true-roots-backend:
    container_name: true-roots-backend
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/real-estate-app-repo:backend"
    restart: always
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/realestate_db
      SPRING_DATASOURCE_USERNAME: team01realestate
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    container_name: true-roots-frontend
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/real-estate-app-repo:frontend"
    restart: always
    ports:
      - "80:80"
    environment:
      NEXT_PUBLIC_API_URL: http://true-roots-backend:8090
      PORT: "80"
      AUTH_SECRET: "${AUTH_SECRET}"
    depends_on:
      - true-roots-backend
    networks:
      - app-network

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: realestate_db
      POSTGRES_USER: team01realestate
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    name: app-network
