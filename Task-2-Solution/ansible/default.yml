
---
- name: Setup Web Servers Based on Environment
  hosts: _default_server
  become: yes
  remote_user: ec2-user

  tasks:
    - name: Install Nginx
      ansible.builtin.package:
        name: nginx
        state: latest

    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes
